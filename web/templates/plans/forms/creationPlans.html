<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans creation</title>
</head>
<body>
    <h2>Agregar plan</h2>
    <form id="addPlansForm">
        <input title="nombre" type="text" placeholder="Nombre" id="name" required>
        <input title="descripcion" type="text" placeholder="Descripcion" id="description">
        <input title="precio" type="text" placeholder="Precio" id="price">
        <input title="duracio meses" type="text" placeholder="Duracion meses" id="monthsduration">
        <input title="maximo usuarios" type="text" placeholder="Maximo usuarios" id="usermax">
        <button title="Guardar nuevo plan" type="submit">Guardar</button>
    </form>
    <script type="module" src="/static/js/plans/planCreate/mainCreatePlans.js"></script>
</body>
</html>
