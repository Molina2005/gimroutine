<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creacion contactos regional</title>
</head>
<body>
    <form id="form-regional-create">
        <input id="name" type="text" placeholder="Nombre">
        <input id="lastname" type="text" placeholder="Apellido">
        <input id="gmail" type="text" placeholder="Correo">
        <input id="phone" type="text" placeholder="Telefono">
        <select id="jobposition">
            <option value="">Seleccione el cargo</option>
        </select>
        <select id="state">
            <option value="">Seleccione el estado</option>
        </select>
        <button type="submit" >Enviar</button>
    </form>
    <script type="module" src="/static/js/clients/d1/regionalContacts.go/contactsCreation/mainContactsCreation.js"></script>
</body>
</html>
