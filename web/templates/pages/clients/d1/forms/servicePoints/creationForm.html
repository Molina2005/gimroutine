<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creacion puntos servicios</title>
</head>
<body>
    <form id="form-servicepoints-create">
        <input type="text" id="name" placeholder="Nombre" required>
        <input type="text" id="addres" placeholder="Direccion" required>
        <input type="text" id="city" placeholder="Ciudad" required>
        <select id="regional">
            <option value="">Seleccione la regional</option required>
        </select>
        <select id="state">
            <option value="">Seleccione el estado</option required>
        </select>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
