<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients</title>
</head>
<body>
    <a href="/addClient" title="" class="btn btn--outline">Agregar</a>
    <a href="/" title="" class="btn btn--outline">Filtros</a>
    <input type="text" id="searchInputClient" placeholder="Buscar cliente...">
    <h2>Gestionar clientes</h2>
    <!-- Tabla de informacion de usuarios -->
    <table>
        <tr>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Correo</th>
            <th>Telefono</th>
            <th>Fecha ingreso</th>
            <th>Estado</th>
            <label>Estado</label>
        </tr>
        <tbody id="clients-table"></tbody>
    </table>
    <!-- Script sweetAlert2 para que pueda funcionar -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/static/js/ui/clients/ui.js"></script>
    <script type="module" src="/static/js/ui/clients/search.js"></script>
</body>

</html>
