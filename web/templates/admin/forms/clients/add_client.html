<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AddClient</title>
</head>
<body>
    <h2>Agregar Cliente</h2>
    <form id="addClientForm">
        <input title="nombre" type="text" placeholder="Nombre" id="name" required>
        <input title="phone" type="text" id="phone" placeholder="phone" required>
        <input title="gmail" type="text" id="gmail" placeholder="gmail" required>
        <input title="nit" type="number" id="nit" placeholder="nit" required>
        <select id="state">
            <option value="">Seleccione un estado</option>
        </select>
        <button title="Guardar nuevo cliente" type="submit">Guardar</button>
    </form>
    <script type="module" src="/static/js/clients/clientsCreate/mainCreateClient.js"></script>
</body>
</html>
